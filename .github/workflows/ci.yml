---
name: CI
'on':
  workflow_dispatch:
  pull_request:
  push:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
  schedule:
    - cron: "31 3 * * 1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: pip3 install yamllint

      - name: Run Yamllint
        run: |
          yamllint .

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v25
  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        distro:
          - centos8
          - debian12
          - debian13
          - ubuntu2204
          - ubuntu2404
          - ubuntu2604
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      - name: Set up Python 3 (CentOS 8).
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        if: matrix.distro == 'centos8'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
        if: matrix.distro != 'centos8'

      - name: Install test dependencies (CentOS 8).
        run: pip3 install -r molecule/requirements-legacy.txt
        if: matrix.distro == 'centos8' || matrix.distro == 'debian10'

      # community.general version >= 9.5.0 is required for the 'dig' lookup filter to support the 'port' parameter
      - name: Install ansible dependencies (CentOS 8).
        run: ansible-galaxy collection install 'community.general:>=9.5.0,<=11' --force
        if: matrix.distro == 'centos8'

      - name: Install test dependencies.
        run: pip3 install -r molecule/requirements.txt
        if: matrix.distro != 'centos8'

      - name: Run Molecule Tests
        run: molecule --debug test --all
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
          ANSIBLE_CONFIG: ${{ github.workspace }}/molecule/ansible.cfg
        if: vars.MOLECULE_DEBUG != 'true'

      - name: Run Molecule Tests with verbose logging
        run: molecule  --debug test --all -- -vv
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
          ANSIBLE_CONFIG: ${{ github.workspace }}/molecule/ansible.cfg
        if: vars.MOLECULE_DEBUG == 'true'
